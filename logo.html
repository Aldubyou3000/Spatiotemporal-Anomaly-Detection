<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS Sentinel Logo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;800;900&display=swap');
  body { display:flex; justify-content:center; align-items:center; min-height:100vh; background:#fff; margin:0; }
  .logo-container { display:flex; flex-direction:column; align-items:center; padding:2rem; }
  .logo-mark { width:285px; height:auto; margin-bottom:20px; overflow:visible; display:block; }
  .brand-name { font-family:'Montserrat',sans-serif; font-weight:900; font-size:42px; color:#000; margin:0; line-height:1; letter-spacing:0.01em; text-align:center; }
  .tagline { font-family:'Montserrat',sans-serif; font-weight:400; font-size:14.8px; color:#000; margin-top:6px; letter-spacing:0.44em; margin-right:-0.44em; text-align:center; }
</style>
</head>
<body>
<div class="logo-container">
  <svg class="logo-mark" viewBox="0 0 285 188" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AWS Sentinel mark">
    <g fill="#000000">
      <!-- Left long diagonal — widened 156→170, lower end fixed, so the extra length extends the upper tip -->
      <rect x="-78" y="-19" width="170" height="38" rx="7.5" ry="7.5" transform="translate(94 64) rotate(-45)" />
      <!-- Right bar: opposite lean (+45°), moved closer to chevron to even gaps & extended so lower tips align diagonally like left -->
      <rect x="-44" y="-19" width="88" height="38" rx="7.5" ry="7.5" transform="translate(198 86) rotate(45)" />
      <!-- Chevron — lifted 1px closer to the pair -->
      <rect x="-36" y="-19" width="72" height="38" rx="7.5" ry="7.5" transform="translate(110 135) rotate(-45)" />
      <rect x="-36" y="-19" width="72" height="38" rx="7.5" ry="7.5" transform="translate(160 135) rotate(45)" />
      <rect x="-19" y="-19" width="38" height="38" rx="7" ry="7" transform="translate(135 110) rotate(45)" />
    </g>
  </svg>
  <h1 class="brand-name">AWS SENTINEL</h1>
  <p class="tagline">ANOMALY DETECTOR</p>
</div>
</body>
</html>
